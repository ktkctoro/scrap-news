<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スクラップ今日（案C）</title>
<!--
  画面案C「朝1分：開いた1画面で答えが出る。続きは下のボタンから」
  - 開いてすぐの1画面に、銅建値（大きく）・鉄・金・ドル円・けさの3行・新しい記事3本
  - 画面の下に大きなボタンを3つ。いちばん押してほしい「記事を読む」だけ色を付ける
  - 記事・くらべる・聞くは、画面ごと切り替わる。左上の「もどる」と、スマホの「戻る」で戻れる
  - 戻ると、けさの画面は元の位置のまま
-->
<style>
  /* ===== 3案に共通の土台 ===================================== */
  :root{
    /* 色は3つ（いまの画面と同じ）。藍=骨組み、緑=高い/上がった、朱=下がった/注意 */
    --ai:#1c74b8;     --ai-dk:#135a91; --ai-bg:#e8f3fc;
    --midori:#0f8650; --midori-bg:#e6f6ed;
    --shu:#c74524;    --shu-dk:#9a3419; --shu-bg:#fdeee9;
    /* 屋外でも読めるよう、文字はいまより濃くした（いちばん薄い灰でも白地で5:1以上） */
    --ink:#14171b; --ink-2:#3c424a; --ink-3:#59606a;
    --line:#dde2e7; --line-2:#b7bfc8;
    --paper:#f2f5f8; --card:#fff;
    --up:var(--midori); --down:var(--shu);
    --tap:48px;   /* 指で押すものの最低の高さ（Android 48dp / iOS 44pt） */
    --gap:8px;    /* 押せるもの同士のすきま */
    --r:12px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* iPhoneの「文字サイズ」設定に追従させる（指で触る端末のときだけ） */
  @media (pointer:coarse){ @supports (font:-apple-system-body){ html{font:-apple-system-body} } }
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;
    padding-left:var(--safe-l);padding-right:var(--safe-r)}
  .wrap{max-width:560px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  input{font:inherit}
  :focus-visible{outline:3px solid var(--ai);outline-offset:2px}
  [hidden]{display:none!important}

  /* 押したら必ず見た目が変わる（押せたことが指に返る） */
  .press{transition:background-color .12s,transform .08s}
  .press:active{transform:scale(.985)}

  .btn{min-height:var(--tap);padding:0 18px;border-radius:var(--r);font-weight:700;font-size:1rem;
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;text-align:center}
  .btn-main{background:var(--ai);color:#fff}
  .btn-main:active{background:var(--ai-dk)}
  .btn-sub{background:var(--card);color:var(--ai);border:1.5px solid var(--ai)}
  .btn-sub:active{background:var(--ai-bg)}

  .eyebrow{font-size:.875rem;font-weight:700;color:var(--ai);letter-spacing:.04em;line-height:1.35;
    border-left:4px solid var(--ai);padding-left:8px;margin-bottom:10px;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .eyebrow .hint{font-size:.8125rem;color:var(--ink-3);font-weight:400;letter-spacing:0}
  .sec{padding:18px 16px 4px}

  /* お知らせ（通信できない・記事が古い・見本） */
  .banner{margin:12px 16px 0;padding:12px 14px;border-radius:var(--r);font-size:.9375rem;line-height:1.6}
  .banner.warn{background:var(--shu-bg);color:var(--shu-dk);border:1px solid #efc0b1}
  .banner.info{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2);font-size:.8125rem;padding:8px 12px}
  .banner .btn{margin-top:10px}

  /* 読み込み中のぐるぐる */
  .loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 16px;color:var(--ink-3)}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ai);
    animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:32px 16px;text-align:center;color:var(--ink-3)}

  /* けさの3行 */
  .brief{margin:14px 16px 0;padding:14px 16px;border-radius:var(--r);background:var(--ai-bg);
    border:1px solid #cfe3f5}
  .brief ul{list-style:none}
  .brief li{position:relative;padding-left:16px;font-size:1rem;line-height:1.65;margin-top:6px}
  .brief li:first-child{margin-top:0}
  .brief li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--ai)}

  /* 数字のタイル */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
  .tile{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;min-height:104px;text-align:left}
  .tile:active{background:var(--ai-bg)}
  .tile .k{font-size:.9375rem;font-weight:700;color:var(--ink-2);line-height:1.3}
  .tile .sub{font-size:.8125rem;color:var(--ink-3);line-height:1.3}
  .tile .v{display:block;font-size:1.375rem;font-weight:800;line-height:1.25;margin-top:6px;letter-spacing:-.01em}
  .tile .d{font-size:.9375rem;font-weight:700}

  /* 数字の行（押すとグラフ） */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .li{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:9px 12px 9px 14px;
    border-bottom:1px solid var(--line);text-align:left}
  .li:last-child{border-bottom:0}
  .li:active{background:var(--ai-bg)}
  .li .kk{flex:1;min-width:0;line-height:1.35}
  .li .k{display:block;font-size:1rem;font-weight:600}
  .li .sub{display:block;font-size:.8125rem;color:var(--ink-3)}
  .li .vv{text-align:right;line-height:1.3;flex:0 0 auto}
  .li .v{font-size:1.125rem;font-weight:800}
  .li .u{font-size:.8125rem;color:var(--ink-3);margin-left:2px;font-weight:500}
  .li .d{display:block;font-size:.875rem;font-weight:700}
  .chev{flex:0 0 auto;width:18px;height:18px;color:var(--line-2)}

  /* 絞り込みチップ */
  .chips{display:flex;flex-wrap:wrap;gap:var(--gap)}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);
    padding-right:32px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:var(--tap);padding:0 16px;border-radius:999px;background:var(--card);
    border:1.5px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:.9375rem;
    display:inline-flex;align-items:center;gap:6px}
  .chip .n{font-size:.8125rem;font-weight:600;color:var(--ink-3)}
  .chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
  .chip[aria-pressed="true"] .n{color:#d6e9f8}
  .chip:active{background:var(--ai-bg)}
  .chip[aria-pressed="true"]:active{background:var(--ai-dk)}

  /* 2〜4つの切り替え（どの案でも、切り替えはこの形だけ） */
  .seg{display:flex;gap:4px;background:#e2e7ec;border-radius:14px;padding:4px}
  .seg button{flex:1;min-height:var(--tap);border-radius:10px;font-weight:700;font-size:.9375rem;
    color:var(--ink-2);text-align:center;padding:0 6px;line-height:1.25}
  .seg button[aria-selected="true"]{background:var(--card);color:var(--ai);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .seg button:active{background:rgba(255,255,255,.6)}

  /* 記事 */
  .feed{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .art{display:block;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
  .art:last-child{border-bottom:0}
  .art:active{background:var(--ai-bg)}
  .art:visited{color:var(--ink-3)}           /* 読んだ記事は灰色になる */
  .art-t{display:block;font-size:1.0625rem;font-weight:700;line-height:1.5;margin:6px 0 4px}
  .meta{display:block;font-size:.8125rem;color:var(--ink-3)}
  .ext{display:inline-block;width:.9em;height:.9em;vertical-align:-.1em;margin-left:3px;opacity:.7}
  .badge{display:inline-block;font-size:.8125rem;font-weight:700;padding:1px 8px;border-radius:6px;line-height:1.6}
  .b-mkt{background:var(--ai-bg);color:var(--ai-dk)}
  .b-law{background:var(--shu-bg);color:var(--shu-dk)}
  .b-gen{background:#ebe9e3;color:var(--ink-2)}
  .b-dc{background:var(--midori-bg);color:#0b6b3f}
  .b-btc{background:#fff3df;color:#8a5200}
  .dups{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;font-size:.8125rem;
    background:var(--ai-bg);color:var(--ai-dk);font-weight:700}

  /* レポート（たたんだ状態で置く） */
  .rep{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .rep + .rep{margin-top:var(--gap)}
  .rep summary{min-height:60px;padding:10px 44px 10px 14px;cursor:pointer;list-style:none;position:relative;
    display:flex;flex-direction:column;justify-content:center;gap:2px}
  .rep summary::-webkit-details-marker{display:none}
  .rep summary::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;margin-top:-7px;
    border-right:2.5px solid var(--ai);border-bottom:2.5px solid var(--ai);transform:rotate(45deg);transition:transform .15s}
  .rep[open] summary::after{transform:rotate(-135deg);margin-top:-2px}
  .rep summary:active{background:var(--ai-bg)}
  .rep .lab{font-size:.8125rem;font-weight:700;color:var(--ai)}
  .rep .lab.mon{color:var(--midori)}
  .rep .ttl{font-size:1rem;font-weight:700;line-height:1.4}
  .rep .body{padding:4px 16px 16px;border-top:1px solid var(--line)}
  .rep .body p{font-size:1rem;line-height:1.85;margin-top:12px}

  /* AIの朝3本・リンク */
  .l3m a{display:flex;gap:10px;align-items:flex-start;min-height:var(--tap);padding:12px 14px;
    border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--card)}
  .l3m a:last-child{border-bottom:0}
  .l3m a:active{background:var(--ai-bg)}
  .l3m .n{flex:0 0 auto;font-weight:800;color:var(--ai);font-size:.9375rem;line-height:1.6}
  .l3m .t{font-size:1rem;font-weight:600;line-height:1.55}
  .linkgroup + .linkgroup{margin-top:14px}
  .glabel{font-size:.8125rem;color:var(--ink-3);font-weight:700;margin-bottom:6px}
  .gsites{display:flex;flex-wrap:wrap;gap:var(--gap)}
  .linkchip{min-height:var(--tap);padding:0 14px;border-radius:999px;border:1.5px solid var(--ai);color:var(--ai);
    background:var(--card);font-weight:700;font-size:.9375rem;text-decoration:none;display:inline-flex;align-items:center}
  .linkchip:active{background:var(--ai-bg)}

  /* AIに聞く */
  .qlist{display:flex;flex-direction:column;gap:var(--gap)}
  .q{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 12px 10px 14px;
    background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);font-size:1rem;font-weight:600;line-height:1.45;text-align:left}
  .q:active{background:var(--ai-bg)}
  .q span{flex:1}
  .askform{display:flex;flex-direction:column;gap:var(--gap)}
  .askform input{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--line-2);border-radius:var(--r);
    font-size:1rem;background:var(--card);color:var(--ink)}
  .askform input:focus{border-color:var(--ai);outline:none;box-shadow:0 0 0 3px var(--ai-bg)}
  .lead{font-size:.9375rem;color:var(--ink-2);line-height:1.6}

  /* 下から出るシート（グラフなど） */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(14,20,28,.5);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
  .sheet.open{opacity:1;visibility:visible}
  .sheet-box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:8px 16px calc(14px + var(--safe-b));
    transform:translateY(40px);transition:transform .22s ease-out;overscroll-behavior:contain}
  .sheet.open .sheet-box{transform:none}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 12px}
  .sheet-title{font-size:1.125rem;font-weight:800;line-height:1.35}
  .sheet-sub{font-size:.8125rem;color:var(--ink-3);margin-bottom:10px}
  .cnow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .cnow .v{font-size:2rem;font-weight:800;line-height:1.2}
  .cnow .u{font-size:.875rem;color:var(--ink-3)}
  .cdiff{font-size:1rem;font-weight:700;margin:2px 0 8px}
  .csvg{display:block;width:100%;height:150px}
  .cfoot{display:flex;justify-content:space-between;gap:8px;font-size:.8125rem;color:var(--ink-3);margin:6px 0 14px}
  .sheet .msg{padding:24px 8px;text-align:center;color:var(--ink-2);line-height:1.8}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation-duration:3s!important} }

  /* 同業くらべ（いちばん高い先を大きく、ほかは下に） */
  .cmp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .ci{padding:12px 14px;border-bottom:1px solid var(--line)}
  .ci:last-child{border-bottom:0}
  .ci-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .ci-n{font-size:1.0625rem;font-weight:800;line-height:1.4}
  .ci-s{font-size:.8125rem;color:var(--shu-dk);font-weight:700;flex:0 0 auto}
  .ci-best{display:flex;align-items:baseline;gap:8px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--midori-bg);color:#0b6b3f}
  .ci-bl{font-size:.8125rem;font-weight:700;flex:0 0 auto}
  .ci-bd{font-size:1rem;flex:1}
  .ci-bv{font-size:1.25rem;font-weight:800}
  .ci-bv small{font-size:.8125rem;margin-left:1px}
  .ci-rest{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;padding:0 2px;font-size:.9375rem;color:var(--ink-2)}
  .ci-rest b{color:var(--ink);font-weight:700}
  .gname{font-size:.9375rem;font-weight:800;color:var(--ink-2);margin:18px 2px 8px}
  .gname:first-child{margin-top:4px}
  .foot{padding:20px 16px 8px;font-size:.8125rem;color:var(--ink-3);line-height:1.7;text-align:center}

  /* ---- 案Cだけの見た目 ---- */
  body{padding-bottom:calc(92px + var(--safe-b))}
  header.top h1{font-size:1.625rem;font-weight:800;line-height:1.3}

  .hero{position:relative;display:block;width:100%;text-align:left;background:var(--card);
    border:2px solid var(--ai);border-radius:16px;padding:12px 16px 14px}
  .hero:active{background:var(--ai-bg)}
  .hero .hk{font-size:1rem;font-weight:800;color:var(--ai)}
  .hero .hs{font-size:.8125rem;color:var(--ink-3);margin-left:6px}
  .hero .hv{display:block;font-size:2.5rem;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin-top:2px}
  .hero .hv small{font-size:1rem;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
  .hero .hd{display:block;font-size:1.0625rem;font-weight:800}
  .hero .hd small{font-size:.8125rem;font-weight:500;color:var(--ink-3);margin-left:6px}
  .hero .hg{position:absolute;right:12px;top:12px;display:flex;align-items:center;font-size:.8125rem;font-weight:700;color:var(--ai)}
  .hero .hg .chev{color:var(--ai);width:16px;height:16px}

  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-top:var(--gap)}
  .mini button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;text-align:left;min-height:88px}
  .mini button:active{background:var(--ai-bg)}
  .mini .k{display:block;font-size:.875rem;font-weight:700;color:var(--ink-2);line-height:1.3}
  .mini .v{display:block;font-size:1.1875rem;font-weight:800;line-height:1.3;margin-top:3px}
  .mini .v small{display:block;font-size:.8125rem;font-weight:500;color:var(--ink-3);line-height:1.2}
  .mini .d{display:block;font-size:.8125rem;font-weight:700}

  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .more-sum{list-style:none;cursor:pointer;min-height:56px;padding:10px 44px 10px 14px;position:relative;
    display:flex;flex-direction:column;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .more-sum::-webkit-details-marker{display:none}
  .more-sum::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;margin-top:-7px;
    border-right:2.5px solid var(--ai);border-bottom:2.5px solid var(--ai);transform:rotate(45deg)}
  details[open] > .more-sum::after{transform:rotate(-135deg);margin-top:-2px}
  details[open] > .more-sum{border-radius:var(--r) var(--r) 0 0;border-bottom:0}
  .more-sum:active{background:var(--ai-bg)}
  .more-sum b{font-size:1rem}
  .more-sum span{font-size:.8125rem;color:var(--ink-3)}
  details[open] > .list{border-radius:0 0 var(--r) var(--r)}

  /* ---- 画面ごと切り替える案（C・D・E・F）の共通部品 ---- */
  body.sub{padding-bottom:calc(24px + var(--safe-b))}
  header.top{padding:calc(14px + var(--safe-t)) 16px 2px}
  header.top .app{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8125rem;font-weight:700;color:var(--ai)}
  header.top .upd{color:var(--ink-3);font-weight:500}

  /* 下の大きなボタン3つ */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line-2);box-shadow:0 -4px 16px rgba(0,0,0,.06);
    padding:8px calc(12px + var(--safe-r)) calc(8px + var(--safe-b)) calc(12px + var(--safe-l))}
  .dock .in{display:flex;gap:var(--gap);max-width:560px;margin:0 auto}
  .dock .btn{min-height:62px;width:auto;white-space:nowrap;padding:0 8px}
  .dock .go{flex:2;font-size:1.0625rem;gap:6px}
  .dock .go .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:0 7px;font-size:.8125rem}
  .dock .sm{flex:1;flex-direction:column;gap:1px;padding:0 4px;font-size:.8125rem}
  .dock svg{width:22px;height:22px;flex:0 0 auto}

  /* 切り替わる画面（記事・くらべる・聞く） */
  .subview{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
  .subtop{position:sticky;top:0;z-index:20;background:rgba(242,245,248,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
  .subhead{display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:60px}
  .back{display:flex;align-items:center;min-height:var(--tap);padding:0 14px 0 4px;border-radius:12px;color:var(--ai);font-weight:700;font-size:1rem}
  .back:active{background:var(--ai-bg)}
  .back svg{width:22px;height:22px}
  .subhead h2{font-size:1.25rem;font-weight:800}
  .subtop .chips,.subtop .seg{margin:0 16px 10px}
  .subtop .chips.scroll{margin:0 0 10px;padding:0 32px 0 16px}
  .endback{padding:20px 16px 0}
</style>
</head>

<div id="home">

レス","cells":[{"dealer":"長澤","value":220,"best":true},{"dealer":"宝源","value":195,"best":false},{"dealer":"土金","value":105,"best":false},{"dealer":"大畑","value":35,"best":false}],"spread":185,"diff":"0"},{"group":"雑品","name":"鉄(B・ギロB)","cells":[{"dealer":"長澤","value":45,"best":true},{"dealer":"宝源","value":43,"best":false}],"spread":2,"diff":"0"}]},"weekly":{"title":"銅最高値更新、貴金属は下落","paragraphs":["先週は銅建値が11万円上げて242万円となり、週で4.8%、月で1.7%の上昇と再び最高値をつけました。背景にはAIデータセンター向けの需要拡大があり、データセンター1基で1,600トン超の銅を使うとの試算や、銅電線の需要が2030年度に60万トン台へ回復するとの見方が出ています。一方で鉄は東鉄名古屋二級が48,500円と横ばい（月+1.0%）で、輸出価格をけん制する狙いの買値上げが伝えられました。貴金属は逆行し、金が23,650円で週-2.5%・月-8.1%、銀が340円で週-6.1%・月-11.0%と大きく下げています。","スクラップヤードの規制が2028年までに全国で許可制へ移行する方向で、環境省の検討会では「二段階の許可審査」が提言されています。金属くずを保管しておくだけで許可が必要になる時代が近づいており、自社のヤードの保管方法や地域との関係を書類で示せるよう、今から整理しておくことが必要です。再資源化事業等高度化法や、保管・荷役施設への補助金といった支援制度も動いているため、設備投資を考えているなら情報を取っておく価値があります。海外では、EUが金属スクラップの輸出先を絞る規則案を進めており、輸出頼みの出し先には注意が要ります。","同業との価格差は今週も大きく、CPUセラ長方形（金足）は浜屋68,800円に対しケイワイ20,600円で、差は48,200円にのぼります。CPUセラ（上）で18,800円、CPU黒で7,900円、PCメモリーで3,100円の差があり、金を含む上位品目ほど売り先選びで手取りが大きく変わります。一方、CPUセラ（金属板あり）はケイワイ20,600円が浜屋19,200円を上回っており、品目ごとに出し先を分ける判断が有効です。K&Yの基板価格はメモリー10,070円、Cクラス1,180円などすべて前回比ゼロで、金の下落がまだ買取価格に反映されていない点は押さえておきたいところです。","銅はAI・データセンター需要を背景に強含みが続く可能性がある一方、中国の銅製錬の採算悪化や国内製錬事業の縮小といった話も出ており、値動きが荒くなる点に注意が必要です。金銀は月間で8〜11%下げており、基板の買取価格が据え置きのままなら、次回改定で下方修正される可能性があります。金を含む基板は在庫を抱え込まず、早めに回す判断も検討材料になります。また、神社の銅板や施設の室外機・蛇口の盗難事件が報じられており、銅高が続く局面では持ち込み品の確認をこれまで以上に厳格にしてください。"],"date":"2026-09-28","label":"9/28の週"},"monthly":{"title":"2026年8月度 相場と業界の動き","paragraphs":["銅建値は月間で0.8%上がり238万円となりました。上げ幅そのものは小さいものの、LME銅は最高値を更新した後も上昇が続き、供給のひっ迫が解けていないと報じられています。AI関連の設備投資で銅の需要が膨らんでいるという見方もあり、住友商事のチリ鉱山参画やコマツの米国保守拠点3倍化など、増産に向けた動きが相次ぎました。一方で鉄は東鉄名古屋二級が48,000円で横ばい、輸出入札は関東鉄源7月契約が2カ月連続で下落し、輸出の成約が進まず需給が緩んでいます。貴金属は週間で金が5.0%安、銀が6.5%安と大きく下げており、買取単価の設定はいったん慎重にみておきたいところです。","段落2の代わりに制度面では、政府が廃棄物処理法の改正案を閣議決定し、使用済み資源を国内で再生することを原則とする方針が示されました。国土交通省はスクラップヤードなどの「不適切な土地利用」への規制強化を進める方針で、ヤード火災をめぐっては福岡県に要望書が提出されるなど、地域からの目も厳しくなっています。6月施行の金属盗対策法では、愛知でケーブルカッターの違法所持による初の逮捕者が出たほか、富山では太陽光発電所から送電ケーブル2.2トンを盗んだ疑いで2人が摘発されました。今月中に、仕入れ時の本人確認と品目・数量の記録が抜けなく残っているか、置き場の区画と消火まわりの状態はどうか、この2点を自社で一度点検しておくことをおすすめします。","同業との価格差は基板系で特に大きく、CPUセラ長方形(金足)は浜屋68,800円に対しケイワイ20,600円と48,200円もの開きがあります。CPUセラ(上)で26,800円、CPU黒で13,500円、CPUセラ(金属板なし)で8,520円と、CPU系はおおむね浜屋が高い並びです。一方でマザーボードはケイワイ2,600円が浜屋2,060円を上回っており、品目ごとに出し先を分けたほうが有利になる可能性があります。K&Yの基板買取は全品目で前回から動きがなく、メモリー10,070円、Cクラス1,180円、Dクラス660円と横ばいですので、単価が動かない今のうちにCPU系を混ぜずに選別する手順を固めておくと差額を取りやすくなります。","1ヶ月の変化率を並べると、銅建値+0.8%、日経平均+3.2%、NYダウ+1.3%、ドル円は-0.3%の160円、ビットコインは+27.1%でした。銅の小幅高は供給ひっ迫と中国の経済指標改善が支えた一方、中国の追加利上げで非鉄全体が軟調になる場面もあり、行って来いの一ヶ月だったと整理できます。鉄は横ばいでしたが、輸出が決まりにくい状態が続けば下押しに注意が必要です。金と銀は直近1週間で5〜6%下げており、月内の高値圏で仕入れた分は利幅が薄くなっている可能性があります。アルミ二次合金が8月に4%安と1年2カ月ぶりに下落した点も、地金頼みの値付けの危うさとして覚えておきたいところです。","今月の重点は3つです。第一に、CPU系基板の選別と出し先の見直しです。差額の大きい上位3品目だけでも分けて出す運用を今月中に試し、実際の手取り差を数字で確認してください。第二に、法令対応の自主点検です。改正案とヤード規制の流れを踏まえ、記録・保管・防火の3点を書面で残しておくと、行政の確認が入った際に慌てずに済みます。第三に、盗品の持ち込み対策です。エアコン室外機や水道メーター、太陽光のケーブルといった被害品が全国で急増しているため、これらの品目は出所の確認を一段厳しくし、疑わしい持ち込みは断る基準を現場に共有しておきましょう。"],"date":"2026-09-01","label":"8月のまとめ"},"ai_morning":{"date":"2026-09-30","items":[{"title":"GPT-6.1 Sol公開 Astra並みの性能で値段は5分の1","link":"https://thelastthreeminutes.com/issues/2026-09-30/stories/1/"},{"title":"OpenAIの常駐AI「dots」 自分のPCを持って24時間働く","link":"https://thelastthreeminutes.com/issues/2026-09-30/stories/2/"},{"title":"月200ドルのPro再開 使える量は半分、月500ドル版も","link":"https://thelastthreeminutes.com/issues/2026-09-30/stories/3/"}],"link":"https://thelastthreeminutes.com/issues/2026-09-30/","lead":"水曜の朝は、DevDayの3本です。GPT-6.1 Solは最上位のAstraに迫る性能を、5分の1の値段で出してきました。常駐エージェントのdotsは、自分のPCを持って24時間働きます。月200ドルのProは再開しましたが、使える量は半分になりました。","video":"https://www.youtube.com/watch?v=yGxM3dOjtHg"},"history":{"NYダウ":{"d":["2026-06-30","2026-07-01","2026-07-02","2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10","2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17","2026-07-20","2026-07-21","2026-07-22","2026-07-23","2026-07-24","2026-07-2 function ago(iso){
  if (!iso) return '';

function splitName(name){

function loadData(){
  var offlineDemo = /[?&]offline\b/.test(location.search);   // 「?offline」を付けると圏外の見え方を試せる
  var net = offlineDemo ? Promise.reject(new Error('demo'))

    var c = null;

function updatedAt(){
  var m = String((DATA && DATA.updated) || '').match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);

  var now = new Date(), d = new Date(now.getFullYear(), m[1] - 1, m[2], m[3], m[4]);

  return d;
}

  if (c) openChart(c.getAttribute('data-chart'), c.getAttribute('data-unit') || '');
});

// ---- 3ヶ月チャート ----------------------------------------------------
function sparkline(vals){
  var W = 340, H = 150, P = 8;
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = (hi - lo) || 1;
  var x = function(i){ return P + i * (W - P * 2) / Math.max(1, vals.length - 1); };
  var y = function(v){ return P + (1 - (v - lo) / span) * (H - P * 2); };
  var pts = vals.map(function(v, i){ return x(i).toFixed(1) + ',' + y(v).toFixed(1); });
  var area = 'M' + x(0).toFixed(1) + ',' + (H - P) + ' L' + pts.join(' L') + ' L' + x(vals.length - 1).toFixed(1) + ',' + (H - P) + ' Z';
  var col = vals[vals.length - 1] >= vals[0] ? 'var(--midori)' : 'var(--shu)';
  return '<svg class="csvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="3か月の推移">' +
    '<path d="' + area + '" fill="' + col + '" opacity=".10"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + x(vals.length - 1).toFixed(1) + '" cy="' + y(vals[vals.length - 1]).toFixed(1) + '" r="4" fill="' + col + '"/></svg>';
}
function md(iso){ var p = String(iso).split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : iso; }

function openChart(key, unit){
  // 基板は「ＣＰＵグリーン（下）」までが品名なので、かっこで分けない
  var h = findHist(key), parts = key.indexOf('基板:') === 0 ? [key.slice(3), ''] : splitName(key);
  $('chart-title').textContent = parts[0];
  $('chart-sub').textContent = (parts[1] ? parts[1] + '・' : '') + '3ヶ月の動き';
  var body = $('chart-body');
  if (!h || !h.v || h.v.length < 3){
    body.innerHTML = '<div class="msg">まだ記録をためているところです。<br>数日たつとグラフが出ます。</div>';
  } else {
    var v = h.v, first = v[0], last = v[v.length - 1], diff = last - first;
    var pct = first ? diff / first * 100 : 0;
    var cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
    var sign = diff > 0 ? '▲ ' : (diff < 0 ? '▼ ' : '± ');
    var f = function(n){ return n.toLocaleString('ja-JP', { maximumFractionDigits: 2 }); };
    body.innerHTML =
      '<div class="cnow"><span class="v num">' + f(last) + '</span><span class="u">' + esc(unit) + '</span></div>' +
      '<div class="cdiff num ' + cls + '">3ヶ月で ' + sign + f(Math.abs(diff)) + '（' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%）</div>' +
      sparkline(v) +
      '<div class="cfoot num"><span>' + md(h.d[0]) + '</span><span>高 ' + f(Math.max.apply(null, v)) +
      '　安 ' + f(Math.min.apply(null, v)) + '</span><span>' + md(h.d[h.d.length - 1]) + '</span></div>';
  }
  openSheet('chart-sheet');
}

function isBoard(r){ return (r.group || '').indexOf('基板') === 0; }
function cmpRows(board){ return ((DATA.compare && DATA.compare.rows) || []).filter(function(r){ return isBoard(r) === board; }); }
function cmpGroups(rows){
  // 「基板／クラス」は後ろ半分を、「銅」はそのまま、かたまりの名前にする
  var out = [], last = null;
  rows.forEach(function(r){
    var g = r.group || '', name = g.indexOf('／') >= 0 ? g.split('／')[1] : g;
    if (!last || last.name !== name){ last = { name: name, rows: [] }; out.push(last); }
    last.rows.push(r);
  });
  return out;
}

// いちばん高い先を1行で大きく、ほかは下に小さく

  var best = r.cells.filter(function(c){ return c.best; }), rest = r.cells.filter(function(c){ return !c.best; });

    (r.spread ? '<span class="ci-s num">最安との差 ' + yen(r.spread) + '円</span>' : '') + '</div>' +

    esc(best.map(function(c){ return c.dealer; }).join('・')) + '</b><span class="ci-bv num">' + yen(best[0].value) + '<small>円</small></span></div>' +
    (rest.length ? '<div class="ci-rest">' + rest.map(function(c){
      return '<span>' + esc(c.dealer) + ' <b class="num">' + yen(c.value) + '</b></span>';
    }).join('') + '</div>' : '') + '</div>';
}

var SUB_HOOK = {};   // 画面を開くときに中身を作る関数（案ごとに登録）
function openSub(id, arg){
  var y = window.scrollY, v = $(id);
  if (SUB_HOOK[id]) SUB_HOOK[id](arg);
  $('home').hidden = true; v.hidden = false; document.body.classList.add('sub');
  window.scrollTo(0, 0);
  openLayer(function(){
    v.hidden = true; $('home').hidden = false; document.body.classList.remove('sub');
    window.scrollTo(0, y);
  });
}

    return '<button class="chip press" type="button" data-g="' + esc(o[0]) + '" aria-pressed="' + (o[0] === cur) + '">' + esc(o[1]) + '</button>';
