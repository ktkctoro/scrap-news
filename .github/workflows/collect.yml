name: 毎朝の収集と公開

on:
  # 日本時間の朝4時30分（UTCの19時30分）。朝5時に見るころには出来ている。
  schedule:
    - cron: "30 19 * * *"
  # manual.json を直したときなど、手で直したら作り直す。
  # ただし画面や中身に関わるファイルのときだけ。ドキュメントを1行直しただけで
  # 記事の取り直し・同業8社の巡回・AIまとめ（有料）まで走らせない。
  push:
    branches: [main]
    paths:
      - "manual.json"
      - "index.html"
      - "**.py"
      - ".github/workflows/collect.yml"
  # GitHubの画面から手で動かせるようにする
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "週次レポートを今すぐ書き直す（月曜以外でも）"
        type: boolean
        default: false
      force_monthly:
        description: "月次レポートを今すぐ書き直す（1日以外でも）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 同時に走らないようにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 記事と為替をあつめる
        run: python collect.py

      - name: 何件取れたか確かめる
        run: python check_data.py

      - name: AIのまとめを書く（鍵があるときだけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize.py

      - name: 週次レポートを書く（月曜だけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '' }}
        run: python weekly.py

      - name: 月次レポートを書く（1日だけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_KIND: monthly
          FORCE_WEEKLY: ${{ inputs.force_monthly && '1' || '' }}
        run: python weekly.py

      - name: data.json と推移の記録を残す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 別の実行や手作業と重なって弾かれることがあるので、何度か試す。
          # data.json と history.json はこの実行で作ったものが正しいので、
          # ぶつかったらリモートの中身に合わせ直してから、この2つだけ置き直す。
          #
          # ここで reset --soft を使ってはいけない。手元の状態を抱えたまま
          # HEADだけ動くので、次の commit が「抱えている全部」を記録し、
          # その間に入ったコードの変更まで巻き戻したコミットになる。
          mkdir -p "$RUNNER_TEMP/keep"
          cp data.json history.json "$RUNNER_TEMP/keep/"
          for i in 1 2 3; do
            git add data.json history.json
            git diff --staged --quiet && exit 0
            git commit -m "毎朝の収集 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push && exit 0
            echo "プッシュがぶつかりました。載せ直して再試行します（$i回目）"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/keep/data.json" "$RUNNER_TEMP/keep/history.json" .
            sleep 5
          done
          echo "::error::data.json の保存に失敗しました"
          exit 1

      - name: 公開するファイルだけまとめる
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
