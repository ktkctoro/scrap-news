name: 毎朝の収集と公開

on:
  # 日本時間の朝4時30分（UTCの19時30分）。朝5時に見るころには出来ている。
  schedule:
    - cron: "30 19 * * *"
  # manual.json を直したときなど、手で直したら作り直す
  push:
    branches: [main]
  # GitHubの画面から手で動かせるようにする
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "週次レポートを今すぐ書き直す（月曜以外でも）"
        type: boolean
        default: false
      force_monthly:
        description: "月次レポートを今すぐ書き直す（1日以外でも）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 同時に走らないようにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 記事と為替をあつめる
        run: python collect.py

      - name: 何件取れたか確かめる
        run: python check_data.py

      - name: AIのまとめを書く（鍵があるときだけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize.py

      - name: 週次レポートを書く（月曜だけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '' }}
        run: python weekly.py

      - name: 月次レポートを書く（1日だけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_KIND: monthly
          FORCE_WEEKLY: ${{ inputs.force_monthly && '1' || '' }}
        run: python weekly.py

      - name: data.json と推移の記録を残す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 別の実行と重なって弾かれることがあるので、何度か試す。
          # data.json と history.json はこの実行で作ったものが正しいので、
          # ぶつかったらリモートの上に「作ったファイルを載せ直して」やり直す。
          for i in 1 2 3; do
            git add data.json history.json
            git diff --staged --quiet && exit 0
            git commit -m "毎朝の収集 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push && exit 0
            echo "プッシュがぶつかりました。載せ直して再試行します（$i回目）"
            git fetch origin main
            git reset --soft origin/main    # 作ったファイルはそのまま残る
            sleep 5
          done
          echo "::error::data.json の保存に失敗しました"
          exit 1

      - name: 公開するファイルだけまとめる
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
