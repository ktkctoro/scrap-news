<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スクラップ今日</title>
<style>
  :root{
    /* 色は3つだけ。役割をはっきり決めて使う。
       藍=骨組み（見出し・タブ・枠）、緑=高い/上がった、朱=下がった/注意。 */
    --ai:#1c74b8;    --ai-bg:#e8f3fc;
    --midori:#0f8650; --midori-bg:#e6f6ed;
    --shu:#c74524;   --shu-bg:#fdeee9;

    --ink:#20242a; --ink-2:#5b6169; --ink-3:#8b9199;
    --line:#e3e6ea;         /* ふつうの区切り線 */
    --line-2:#c6ccd4;       /* 強めの輪郭 */
    --paper:#f7fafc; --card:#fff;

    /* 上げ下げ・分類はすべて上の3色に割り当てる */
    --up:var(--midori); --down:var(--shu);
    --mkt:var(--ai);      --mkt-bg:var(--ai-bg);
    --law:var(--shu);     --law-bg:var(--shu-bg);
    --dc:var(--midori);   --dc-bg:var(--midori-bg);
    --gen:var(--ink-2);   --gen-bg:#eceae4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);padding:16px 12px 40px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .phone{max-width:400px;margin:0 auto;background:var(--card);
    border:2px solid var(--ai);border-radius:14px;overflow:hidden}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}

  header{padding:14px 16px 12px;background:var(--ai);color:#fff;
    display:flex;align-items:baseline;justify-content:space-between}
  header h1{font-size:17px;font-weight:700;letter-spacing:.02em}
  header time{font-size:12px;color:#d7e9f7}

  section{padding:14px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:11px;letter-spacing:.08em;color:var(--ai);font-weight:600;
    border-left:3px solid var(--ai);padding-left:7px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px}
  .tile .k{font-size:12px;color:var(--ink-2);margin-bottom:3px}
  .tile .v{font-size:20px;font-weight:600;line-height:1.2}
  .tile .u{font-size:11px;color:var(--ink-3);font-weight:400}
  .tile .d{font-size:12px;margin-top:2px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}

  .row{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none;padding-bottom:0}
  .row .k{font-size:14px}
  .row .v{font-size:16px;font-weight:600}
  .row .u{font-size:11px;color:var(--ink-3);margin-left:2px}
  .row .d{font-size:12px;margin-left:6px}
  .note{font-size:11px;color:var(--ink-3);margin-left:4px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .chip{flex:0 0 auto;font-size:13px;padding:6px 13px;border:1px solid var(--line-2);background:var(--card);
    border-radius:999px;color:var(--ink-2);cursor:pointer;font-family:inherit;font-weight:600}
  .chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
  .chip:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

  #feed{max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;border-bottom:1px solid var(--line)}

  article{padding:14px 16px;border-bottom:1px solid var(--line)}
  article:last-child{border-bottom:none}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;
    border-radius:4px;border:1px solid currentColor}
  .b-law{background:var(--law-bg);color:var(--law)}
  .b-mkt{background:var(--mkt-bg);color:var(--mkt)}
  .b-gen{background:var(--gen-bg);color:var(--gen)}
  .b-dc{background:var(--dc-bg);color:var(--dc)}
  .b-btc{background:var(--shu-bg);color:var(--shu)}
  article a{display:block;font-size:15.5px;font-weight:600;line-height:1.45;margin:7px 0 5px;color:inherit;text-decoration:none}
  article a:active{opacity:.6}
  .meta{font-size:11.5px;color:var(--ink-3)}
  .dups{margin-left:6px;padding:1px 6px;border-radius:4px;font-size:10.5px;
    background:var(--ai-bg);color:var(--ai);font-weight:600}
  .msg{padding:28px 16px;font-size:13px;color:var(--ink-3);text-align:center;line-height:1.7}
  .stale{padding:9px 16px;font-size:12px;color:var(--shu);background:var(--shu-bg);
    border-bottom:1px solid var(--line)}

  .brief{padding:14px 16px;border-bottom:2px solid var(--line-2);background:var(--ai-bg)}
  .brief .line{font-size:14px;line-height:1.8;color:var(--ink)}

  .ask{padding:14px 16px;border-top:1px solid var(--line)}
  .ask form{display:flex;gap:8px}
  .ask input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;
    font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
  .ask input:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
  .ask button[type="submit"]{padding:9px 16px;border:none;border-radius:8px;background:var(--ai);
    color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .hint{font-size:12px;padding:5px 10px;border:1px solid var(--line-2);background:var(--card);
    border-radius:999px;color:var(--ink-2);cursor:pointer;font-family:inherit}

  .tabs{display:flex;border-bottom:2px solid var(--line-2);background:var(--paper)}
  .tab{flex:1;padding:12px 8px;border:none;background:transparent;font-family:inherit;
    font-size:14px;font-weight:700;color:var(--ink-3);cursor:pointer;
    border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:var(--ai);border-bottom-color:var(--ai);background:var(--card)}
  .tab:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}

  .pagetabs{display:flex;gap:6px;padding:12px 16px 0}
  .pagetab{flex:1;padding:9px 8px;border:1px solid var(--line-2);border-radius:8px;
    background:var(--card);font-family:inherit;font-size:13.5px;font-weight:700;
    color:var(--ink-2);cursor:pointer}
  .pagetab[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
  .pagetab:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

  .cmp{padding:14px 16px;border-bottom:1px solid var(--line)}
  .cmp .item{padding:9px 0;border-bottom:1px solid var(--line)}
  .cmp .item:last-child{border-bottom:none;padding-bottom:0}
  .cmp .iname{font-size:13.5px;font-weight:600;margin-bottom:4px}
  .cmp .cells{display:flex;flex-wrap:wrap;gap:5px}
  .cmp .cell{font-size:12.5px;padding:3px 8px;border-radius:5px;background:var(--card);
    border:1px solid var(--line-2);color:var(--ink-2)}
  .cmp .cell b{font-weight:600;color:var(--ink)}
  .cmp .cell.best{background:var(--midori);border-color:var(--midori);color:#fff}
  .cmp .cell.best b{color:#fff}
  .cmp .spread{font-size:11px;color:var(--shu);margin-left:8px;font-weight:600}
  .cmp .cgroup{font-size:11px;letter-spacing:.06em;font-weight:700;color:#fff;background:var(--ai);
    border-radius:4px;padding:3px 10px;margin:14px 0 4px;display:inline-block}
  .cmp .cgroup:first-child{margin-top:0}
  .subtabs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
  .subtab{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
    cursor:pointer;font-family:inherit}
  .subtab[aria-selected="true"]{background:var(--ai-bg);border-color:var(--ai);color:var(--ai)}
  .subtab:focus-visible{outline:2px solid var(--ai);outline-offset:1px}

  /* 指標をタッチしたときに出るチャート */
  .tapable{cursor:pointer}
  .tapable:active{background:var(--ai-bg)}
  .sheet{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(20,28,38,.45);padding:16px}
  .sheet[open]{display:flex}
  .sheetbox{background:var(--card);border:2px solid var(--ai);border-radius:14px;
    width:100%;max-width:380px;overflow:hidden}
  .sheethead{background:var(--ai);color:#fff;padding:11px 14px;display:flex;
    align-items:baseline;justify-content:space-between;gap:8px}
  .sheethead b{font-size:15px;font-weight:700}
  .sheethead .x{background:transparent;border:none;color:#fff;font-size:20px;
    line-height:1;cursor:pointer;padding:0 2px;font-family:inherit}
  .sheetbody{padding:14px}
  .sheetnow{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .sheetnow .v{font-size:26px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sheetnow .u{font-size:12px;color:var(--ink-3)}
  .sheetnow .d{font-size:13px;font-weight:600;margin-left:auto}
  .sheetsvg{width:100%;height:130px;display:block}
  .sheetfoot{display:flex;justify-content:space-between;font-size:11.5px;
    color:var(--ink-3);margin-top:6px}

  .links{padding:14px 16px;border-top:1px solid var(--line)}
  .linkrow{display:flex;flex-direction:column;gap:10px;margin-top:2px}
  .linkgroup{display:flex;align-items:baseline;gap:8px}
  .glabel{flex:0 0 68px;font-size:12px;color:var(--ink-3)}
  .gsites{display:flex;flex-wrap:wrap;gap:6px}
  .linkchip{font-size:13px;padding:7px 12px;border:1px solid var(--ai);border-radius:999px;
    color:var(--ai);text-decoration:none;background:var(--card);font-weight:600}
  .linkchip:active{opacity:.6}
  .disclaimer{max-width:400px;margin:12px auto 0;font-size:11.5px;color:var(--ink-3);line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1>スクラップ今日</h1>
    <time class="num" id="updated">—</time>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-today" role="tab" aria-selected="true" aria-controls="page-today">けさ</button>
    <button class="tab" id="tab-compare" role="tab" aria-selected="false" aria-controls="page-compare">くらべる</button>
  </div>

  <div id="page-today" role="tabpanel" aria-labelledby="tab-today">
  <div id="brief"></div>
  <div id="prices"></div>
  <div class="chips" role="group" aria-label="記事の絞り込み">
    <button class="chip" data-f="all" aria-pressed="true">すべて</button>
    <button class="chip" data-f="mkt" aria-pressed="false">相場</button>
    <button class="chip" data-f="law" aria-pressed="false">法規制</button>
    <button class="chip" data-f="gen" aria-pressed="false">業界</button>
    <button class="chip" data-f="dc" aria-pressed="false">AI・DC</button>
    <button class="chip" data-f="btc" aria-pressed="false">ビットコイン</button>
  </div>
  <div id="feed"><div class="msg">読み込んでいます…</div></div>
  <div class="ask">
    <div class="eyebrow">AIに聞く（Claudeのチャットが開きます）</div>
    <form id="askform">
      <input id="askbox" type="search" placeholder="例: アルミの直近の相場は？" aria-label="AIへの質問">
      <button type="submit">聞く</button>
    </form>
    <div class="hints">
      <button type="button" class="hint" data-q="アルミ二次地金の直近の相場は？">アルミ相場</button>
      <button type="button" class="hint" data-q="銅建値の今後の見通しは？">銅の見通し</button>
      <button type="button" class="hint" data-q="鉄スクラップ相場の直近の動きは？">鉄の動き</button>
      <button type="button" class="hint" data-q="金属盗対策法で金属くず買取業者に必要な対応は？">金属盗対策法</button>
    </div>
  </div>
  </div><!-- /page-today -->

  <div id="page-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
    <div class="pagetabs" role="tablist">
      <button class="pagetab" id="ptab-scrap" role="tab" aria-selected="true">スクラップ</button>
      <button class="pagetab" id="ptab-board" role="tab" aria-selected="false">基板</button>
    </div>
    <div id="sub-scrap">
      <div id="compare"></div>
      <div class="links">
        <div class="eyebrow">よく見る価格表（新しいタブで開きます）</div>
        <div class="linkrow" id="linkrow"></div>
      </div>
    </div>
    <div id="sub-board" hidden>
      <div id="board"></div>
      <div class="links">
        <div class="eyebrow">基板の価格表（新しいタブで開きます）</div>
        <div class="linkrow" id="linkrow-board"></div>
      </div>
    </div>
  </div>
</div>
<p class="disclaimer" id="foot"></p>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheetbox">
    <div class="sheethead">
      <b id="sheet-title">—</b>
      <button class="x" id="sheet-close" aria-label="閉じる">×</button>
    </div>
    <div class="sheetbody" id="sheet-body"></div>
  </div>
</div>

<script>
var DATA = null, FILTER = 'all';

function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

function diffClass(d){
  if (!d) return 'flat';
  var s = String(d).trim();
  if (s.charAt(0) === '+') return 'up';
  if (s.charAt(0) === '-' || s.charAt(0) === '−') return 'down';
  return 'flat';
}
function diffText(d){
  if (!d) return '± 0';
  var s = String(d).trim();
  if (s === '0') return '± 0';
  if (s.charAt(0) === '+') return '▲ ' + s.slice(1);
  if (s.charAt(0) === '-' || s.charAt(0) === '−') return '▼ ' + s.slice(1);
  return s;
}

function ago(iso){
  if (!iso) return '';
  var t = new Date(iso), now = new Date();
  var h = Math.floor((now - t) / 3600000);
  if (h < 1) return 'さっき';
  if (h < 24) return h + '時間前';
  var d = Math.floor(h / 24);
  return d === 1 ? '昨日' : d + '日前';
}

function renderPrices(){
  var m = (DATA && DATA.manual) || {}, fx = DATA && DATA.fx;
  var html = '';

  if (m.tiles && m.tiles.length){
    html += '<section><div class="eyebrow">建値</div><div class="grid">';
    m.tiles.forEach(function(t){
      html += '<div class="tile tapable" data-name="' + esc(t.name) + '" data-unit="' +
        esc(t.unit || '') + '"><div class="k">' + esc(t.name) + '</div>' +
        '<div class="v num">' + esc(t.value) + '<span class="u"> ' + esc(t.unit || '') + '</span></div>' +
        '<div class="d num ' + diffClass(t.diff) + '">' + esc(diffText(t.diff)) + '</div></div>';
    });
    html += '</div></section>';
  }

  function rowHtml(r){
    return '<div class="row tapable" data-name="' + esc(r.name) + '" data-unit="' +
      esc(r.unit || '') + '" data-key="' + esc((r.board ? '基板:' : '') + r.name) +
      '"><span class="k">' + esc(r.name) + '</span><span>' +
      '<span class="v num">' + esc(r.value) + '</span>' +
      (r.unit ? '<span class="u">' + esc(r.unit) + '</span>' : '') +
      (r.diff ? '<span class="d num ' + diffClass(r.diff) + '">' + esc(diffText(r.diff)) + '</span>' : '') +
      (r.fx ? '<span class="note">' + esc(DATA.fx.date || '') + '</span>' : '') +
      '</span></div>';
  }

  var rows = (m.rows || []).slice();
  if (fx && fx.usdjpy) rows.push({ name: 'ドル円', value: fx.usdjpy.toFixed(2), unit: '', diff: '', fx: true });

  if (rows.length){
    html += '<section><div class="eyebrow">貴金属・市況</div>';
    rows.forEach(function(r){ html += rowHtml(r); });
    html += '</section>';
  }

  var b = DATA && DATA.boards;
  if (b && b.rows && b.rows.length){
    html += '<section><div class="eyebrow">よく出す基板（K&amp;Y' +
      (b.asof ? '・' + esc(b.asof) + '改定' : '') + '）</div>';
    b.rows.forEach(function(r){
      html += rowHtml({ name: r.name, value: r.value, unit: r.unit, diff: r.diff, board: true });
    });
    html += '</section>';
  }
  var host = document.getElementById('prices');
  host.innerHTML = html;

  // 指標をタッチしたら3ヶ月チャートを出す
  host.querySelectorAll('.tapable').forEach(function(el){
    el.addEventListener('click', function(){
      openChart(el.dataset.name, el.dataset.unit, el.dataset.key);
    });
  });
}

// ---- 指標をタッチしたときの3ヶ月チャート ----------------------------

function histKey(name){
  // 「銅建値（8/21改定）」→「銅建値」。日付つきの表示名から記録用の名前へ。
  return String(name).replace(/[（(].*$/, '').trim();
}

function sparkline(vals){
  var W = 340, H = 130, P = 6;
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var span = (hi - lo) || 1;
  var x = function(i){ return P + i * (W - P * 2) / Math.max(1, vals.length - 1); };
  var y = function(v){ return P + (1 - (v - lo) / span) * (H - P * 2); };

  var line = vals.map(function(v, i){ return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
  var area = 'M' + x(0).toFixed(1) + ',' + (H - P) + ' L' + line.split(' ').join(' L') +
             ' L' + x(vals.length - 1).toFixed(1) + ',' + (H - P) + ' Z';
  var up = vals[vals.length - 1] >= vals[0];
  var col = up ? 'var(--midori)' : 'var(--shu)';

  return '<svg class="sheetsvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
    'role="img" aria-label="3か月の推移">' +
    '<path d="' + area + '" fill="' + col + '" opacity="0.10"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + col +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(vals.length - 1).toFixed(1) + '" cy="' + y(vals[vals.length - 1]).toFixed(1) +
      '" r="3.5" fill="' + col + '"/>' +
    '</svg>';
}

function openChart(name, unit, key){
  var h = DATA && DATA.history && DATA.history[histKey(key || name)];
  var body = document.getElementById('sheet-body');
  document.getElementById('sheet-title').textContent = name;

  if (!h || !h.v || h.v.length < 3){
    body.innerHTML = '<div class="msg">まだ推移を記録中です。<br>' +
      '数日たつとグラフが出ます。</div>';
  } else {
    var v = h.v, first = v[0], last = v[v.length - 1];
    var diff = last - first;
    var pct = first ? (diff / first * 100) : 0;
    var cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
    var sign = diff > 0 ? '▲ ' : (diff < 0 ? '▼ ' : '± ');
    var fmt = function(n){ return n.toLocaleString('ja-JP', {maximumFractionDigits: 2}); };

    body.innerHTML =
      '<div class="sheetnow"><span class="v num">' + fmt(last) + '</span>' +
      (unit ? '<span class="u">' + esc(unit) + '</span>' : '') +
      '<span class="d num ' + cls + '">' + sign + fmt(Math.abs(diff)) +
      '（' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%）</span></div>' +
      sparkline(v) +
      '<div class="sheetfoot"><span>' + esc(h.d[0]) + '</span>' +
      '<span>高 ' + fmt(Math.max.apply(null, v)) + ' / 安 ' + fmt(Math.min.apply(null, v)) + '</span>' +
      '<span>' + esc(h.d[h.d.length - 1]) + '</span></div>';
  }
  document.getElementById('sheet').setAttribute('open', '');
}

function closeChart(){ document.getElementById('sheet').removeAttribute('open'); }

document.getElementById('sheet-close').addEventListener('click', closeChart);
document.getElementById('sheet').addEventListener('click', function(e){
  if (e.target === this) closeChart();   // 外側を押したら閉じる
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeChart();
});

function renderCompare(){
  var c = DATA && DATA.compare;
  if (!c || !c.rows || !c.rows.length) return;
  // 基板は独立したページに出すので、ここで振り分ける
  var isBoard = function(r){ return (r.group || '').indexOf('基板') === 0; };
  drawCompare('compare', '同業の買取価格くらべ', c.dealers,
              c.rows.filter(function(r){ return !isBoard(r); }));
  drawCompare('board', '基板の買取価格くらべ', c.dealers,
              c.rows.filter(isBoard));
}

function drawCompare(hostId, title, dealers, rows){
  if (!rows.length) return;
  // その表に実際に出てくる会社だけを見出しに書く
  var used = [];
  rows.forEach(function(r){
    r.cells.forEach(function(x){
      if (used.indexOf(x.dealer) < 0) used.push(x.dealer);
    });
  });
  var c = { dealers: used, rows: rows };
  var html = '<div class="cmp"><div class="eyebrow">' + esc(title) + '（' +
    esc(used.join('・')) + '）</div>';
  // 分野名が「基板／クラス」のように ／ を含むものは、
  // 前半を大見出し、後半を内側のタブとしてまとめる。
  function itemHtml(r){
    var s = '<div class="item"><div class="iname">' + esc(r.name) +
      (r.spread ? '<span class="spread">差 ' + esc(String(r.spread)) + '円</span>' : '') +
      '</div><div class="cells">';
    r.cells.forEach(function(x){
      s += '<span class="cell' + (x.best ? ' best' : '') + '">' + esc(x.dealer) +
        ' <b class="num">' + x.value.toLocaleString() + '</b></span>';
    });
    return s + '</div></div>';
  }

  // 分野を順番どおりのかたまりにする
  var blocks = [], last = null;
  c.rows.forEach(function(r){
    var g = r.group || '';
    var head = g.indexOf('／') >= 0 ? g.split('／')[0] : g;
    var sub  = g.indexOf('／') >= 0 ? g.split('／')[1] : null;
    if (!last || last.head !== head){
      last = { head: head, subs: [] };
      blocks.push(last);
    }
    var tail = last.subs[last.subs.length - 1];
    if (!tail || tail.name !== sub){
      tail = { name: sub, rows: [] };
      last.subs.push(tail);
    }
    tail.rows.push(r);
  });

  var boxId = 0;
  blocks.forEach(function(b){
    // かたまりが1つだけなら大見出しは省く（基板ページのように内タブだけで足りる場合）
    if (blocks.length > 1) html += '<div class="cgroup">' + esc(b.head) + '</div>';
    if (b.subs.length === 1 && b.subs[0].name === null){
      b.subs[0].rows.forEach(function(r){ html += itemHtml(r); });
      return;
    }
    boxId++;
    html += '<div class="subtabs" role="tablist" data-box="' + boxId + '">';
    b.subs.forEach(function(s, i){
      html += '<button class="subtab" role="tab" data-box="' + boxId + '" data-i="' + i +
        '" aria-selected="' + (i === 0) + '">' + esc(s.name) + '</button>';
    });
    html += '</div>';
    b.subs.forEach(function(s, i){
      html += '<div class="subpane" data-box="' + boxId + '" data-i="' + i + '"' +
        (i === 0 ? '' : ' hidden') + '>';
      s.rows.forEach(function(r){ html += itemHtml(r); });
      html += '</div>';
    });
  });

  html += '</div>';
  var host = document.getElementById(hostId);
  host.innerHTML = html;

  host.querySelectorAll('.subtab').forEach(function(btn){
    btn.addEventListener('click', function(){
      var box = btn.dataset.box, i = btn.dataset.i;
      host.querySelectorAll('.subtab[data-box="' + box + '"]').forEach(function(b){
        b.setAttribute('aria-selected', String(b.dataset.i === i));
      });
      host.querySelectorAll('.subpane[data-box="' + box + '"]').forEach(function(p){
        p.hidden = p.dataset.i !== i;
      });
    });
  });
}

function renderFeed(){
  var feed = document.getElementById('feed');
  var items = ((DATA && DATA.items) || []).filter(function(i){ return FILTER === 'all' || i.cat === FILTER; });
  if (!items.length){ feed.innerHTML = '<div class="msg">該当する記事はありません</div>'; return; }
  var head = DATA.items_stale
    ? '<div class="stale">けさは記事を取れませんでした。前回のものを出しています。</div>' : '';
  feed.innerHTML = head + items.map(function(i){
    return '<article><span class="badge b-' + esc(i.cat) + '">' + esc(i.label) + '</span>' +
      '<a href="' + esc(i.link) + '" target="_blank" rel="noopener">' + esc(i.title) + '</a>' +
      '<div class="meta">' + esc(i.source) + (i.published ? ' · ' + ago(i.published) : '') +
      (i.dups ? '<span class="dups">ほか' + i.dups + '社</span>' : '') + '</div></article>';
  }).join('');
  feed.scrollTop = 0;  // 絞り込みを切り替えたら窓の先頭に戻す
}
